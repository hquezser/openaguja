name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # btleplug (feature cli) lie dbus sur Linux.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  public-check:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/public-check.sh

  # Les vérifications macOS (swift-check, build iOS) vivent dans
  # macos.yml — déclenchement manuel : les runners macOS hébergés ne
  # sont pas attribués à ce compte pour le moment. Voir macos.yml.
