name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before asking for a new feature,
        check [docs/CUSTOMIZATION.md](https://github.com/hquezser/openaguja/blob/main/docs/CUSTOMIZATION.md)
        — routing modes, webhooks and profiles already cover a lot of
        customization without code changes.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should OpenAguja do? Sketch the behavior you imagine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or workarounds you use today.
  - type: input
    id: context
    attributes:
      label: Context (optional)
      description: Watch model, firmware version, platforms involved.
