name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check existing issues first.
        If the problem involves watch commands, read
        [docs/SAFETY.md](https://github.com/hquezser/openaguja/blob/main/docs/SAFETY.md)
        before experimenting — some operations can damage the watch.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
      placeholder: |
        I was trying to …
        I expected …
        Instead, …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version, CLI version, or commit SHA.
      placeholder: "v1.0.0 / openaguja 0.1.0 / commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS app
        - macOS CLI
        - Linux CLI
        - openaguja-macd
        - Documentation / site
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: Watch model, firmware version, iOS / macOS version — whatever is relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: |
        **Redact tokens, credentialed URLs, device IDs and personal
        data before pasting.** For watch issues, note whether you
        reproduced with `--mock` or on a real watch.
